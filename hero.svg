<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1120" />
      <stop offset="100%" stop-color="#08071a" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="neon-glow-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <linearGradient id="border-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-rev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes float-badge-alt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes wave-data {
      0%, 100% { height: 16px; y: 220px; }
      50% { height: 38px; y: 198px; }
    }
    @keyframes wave-data-2 {
      0%, 100% { height: 32px; y: 204px; }
      50% { height: 14px; y: 222px; }
    }
    @keyframes wave-data-3 {
      0%, 100% { height: 24px; y: 212px; }
      50% { height: 44px; y: 192px; }
    }
    @keyframes border-glow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
    }

    .pulse-anim { animation: pulse-slow 4s ease-in-out infinite; }
    .orbit-1 { transform-origin: 740px 185px; animation: rotate-slow 22s linear infinite; }
    .orbit-2 { transform-origin: 740px 185px; animation: rotate-rev 28s linear infinite; }
    .orbit-3 { transform-origin: 740px 185px; animation: rotate-slow 35s linear infinite; }
    .float-item1 { animation: float-badge 4.5s ease-in-out infinite; }
    .float-item2 { animation: float-badge-alt 5s ease-in-out infinite; }
    .float-item3 { animation: float-badge 6s ease-in-out 1s infinite; }
    .cursor-blink { animation: blink-cursor 1s infinite; }
    .bar-1 { animation: wave-data 2.2s ease-in-out infinite; }
    .bar-2 { animation: wave-data-2 1.8s ease-in-out infinite; }
    .bar-3 { animation: wave-data-3 2.6s ease-in-out infinite; }
    .border-active { animation: border-glow 3s ease-in-out infinite; }
    
    .font-mono { font-family: 'SF Pro Text', 'Fira Code', 'Roboto Mono', monospace; }
    .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
  </style>

  <!-- Main Background Panel -->
  <rect x="2" y="2" width="916" height="366" rx="20" fill="url(#bg-grad)" />
  
  <!-- Cyber Matrix Grid Background -->
  <rect x="2" y="2" width="916" height="366" rx="20" fill="url(#cyber-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#00f2fe" opacity="0.06" filter="url(#glow-strong)" />
  <circle cx="740" cy="185" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow-strong)" />
  <circle cx="500" cy="300" r="120" fill="#06b6d4" opacity="0.05" filter="url(#glow-strong)" />

  <!-- Outer Cyber Border -->
  <rect x="2" y="2" width="916" height="366" rx="20" fill="none" stroke="url(#border-stream)" stroke-width="1.5" class="border-active" />

  <!-- Left Side: Content Section -->
  
  <!-- Main Name Title -->
  <text x="45" y="85" class="font-sans" font-size="44" font-weight="900" fill="url(#neon-glow-text)" letter-spacing="1.5">
    YOGESH KADWE
  </text>

  <!-- Role Subtitle with Glowing Accent -->
  <g transform="translate(45, 105)">
    <text x="0" y="18" class="font-sans" font-size="20" font-weight="700" fill="#f8fafc">
      B.Tech CSE Student 
      <tspan fill="#38bdf8"> | </tspan>
      <tspan fill="#00f2fe">Aspiring Data Scientist</tspan>
    </text>
  </g>

  <!-- College & Specialization Tagline -->
  <g transform="translate(45, 142)">
    <path d="M0 0 L 4 0 L 4 28 L 0 28 Z" fill="#818cf8" />
    <text x="14" y="13" class="font-sans" font-size="13" fill="#cbd5e1" font-weight="500">
      🏛️ SBJITMR, Nagpur (S.B. Jain Institute of Technology, Management &amp; Research)
    </text>
    <text x="14" y="28" class="font-sans" font-size="12" fill="#94a3b8">
      AI • Machine Learning • Data Science • Computer Vision • NLP
    </text>
  </g>

  <!-- Animated Terminal Command Input Line -->
  <g transform="translate(45, 196)">
    <rect width="470" height="34" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" class="font-mono" font-size="13" fill="#00f2fe" font-weight="bold">&gt;</text>
    <text x="32" y="22" class="font-mono" font-size="12" fill="#e2e8f0">
      <tspan fill="#a855f7">import</tspan> data_science, machine_learning, ai
    </text>
    <rect x="415" y="10" width="8" height="15" fill="#38bdf8" class="cursor-blink" />
  </g>

  <!-- Tech Badges Pills (Row 1) -->
  <g transform="translate(45, 252)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="88" height="26" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3" fill="#38bdf8" />
      <text x="22" y="17" class="font-mono" font-size="11" font-weight="600" fill="#93c5fd">Python</text>
    </g>
    <!-- AI / ML -->
    <g transform="translate(96, 0)">
      <rect width="84" height="26" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3" fill="#c084fc" />
      <text x="22" y="17" class="font-mono" font-size="11" font-weight="600" fill="#d8b4fe">AI / ML</text>
    </g>
    <!-- Data Science -->
    <g transform="translate(188, 0)">
      <rect width="112" height="26" rx="6" fill="#111827" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3" fill="#22d3ee" />
      <text x="22" y="17" class="font-mono" font-size="11" font-weight="600" fill="#67e8f9">Data Science</text>
    </g>
    <!-- Computer Vision -->
    <g transform="translate(308, 0)">
      <rect width="134" height="26" rx="6" fill="#111827" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3" fill="#34d399" />
      <text x="22" y="17" class="font-mono" font-size="11" font-weight="600" fill="#6ee7b7">Computer Vision</text>
    </g>
    <!-- SQL -->
    <g transform="translate(450, 0)">
      <rect width="65" height="26" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="12" cy="13" r="3" fill="#fbbf24" />
      <text x="22" y="17" class="font-mono" font-size="11" font-weight="600" fill="#fde68a">SQL</text>
    </g>
  </g>

  <!-- Bottom Cyber Ticker / Location Status -->
  <g transform="translate(45, 310)" class="font-mono" font-size="10.5" fill="#64748b">
    <text x="0" y="12">📍 NAGPUR, INDIA</text>
    <text x="130" y="12" fill="#334155">|</text>
    <text x="145" y="12" fill="#38bdf8">💡 TURNING IDEAS INTO REAL SOLUTIONS</text>
    <text x="430" y="12" fill="#334155">|</text>
    <text x="445" y="12" fill="#10b981">✨ READY TO COLLABORATE</text>
  </g>

  <!-- Right Side: 3D Futuristic Neural Core & Data Orb -->
  <g id="right-visual" transform="translate(0, 0)">
    
    <!-- Large Outer Ambient Glow -->
    <circle cx="740" cy="185" r="130" fill="url(#core-glow)" opacity="0.08" filter="url(#glow-strong)" />

    <!-- Outer Orbit Ring 3 -->
    <g class="orbit-3">
      <ellipse cx="740" cy="185" rx="135" ry="135" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
      <circle cx="875" cy="185" r="5" fill="#a855f7" filter="url(#glow-cyan)" />
      <circle cx="605" cy="185" r="4" fill="#38bdf8" />
    </g>

    <!-- Middle Orbit Ring 2 (Tilted) -->
    <g class="orbit-2">
      <ellipse cx="740" cy="185" rx="105" ry="55" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-30 740 185)"/>
      <circle cx="845" cy="185" r="4" fill="#00f2fe" filter="url(#glow-cyan)" transform="rotate(-30 740 185)" />
      <circle cx="635" cy="185" r="3.5" fill="#ec4899" transform="rotate(-30 740 185)" />
    </g>

    <!-- Inner Orbit Ring 1 (Opposite Tilt) -->
    <g class="orbit-1">
      <ellipse cx="740" cy="185" rx="100" ry="50" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" transform="rotate(45 740 185)"/>
      <circle cx="840" cy="185" r="4.5" fill="#00e5ff" filter="url(#glow-cyan)" transform="rotate(45 740 185)" />
    </g>

    <!-- Central Cyber Neural Sphere -->
    <circle cx="740" cy="185" r="54" fill="#0b1329" stroke="url(#cyan-blue-grad)" stroke-width="2.5" filter="url(#drop-shadow)" />
    <circle cx="740" cy="185" r="44" fill="#111c38" opacity="0.9"/>
    <circle cx="740" cy="185" r="32" fill="#1e1b4b" opacity="0.7"/>

    <!-- Neural Core Central Icon / Brain Node Graphic -->
    <g transform="translate(720, 165)" filter="url(#glow-cyan)">
      <!-- AI Brain / Chip Vectors -->
      <path d="M 20 4 C 11.163 4 4 11.163 4 20 C 4 28.837 11.163 36 20 36 C 28.837 36 36 28.837 36 20 C 36 11.163 28.837 4 20 4 Z" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 12 15 L 20 10 L 28 15 L 28 25 L 20 30 L 12 25 Z" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="20" cy="20" r="4" fill="#38bdf8" />
      <line x1="20" y1="10" x2="20" y2="16" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="24" x2="20" y2="30" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="12" y1="15" x2="17" y2="18" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="28" y1="15" x2="23" y2="18" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="12" y1="25" x2="17" y2="22" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="28" y1="25" x2="23" y2="22" stroke="#00f2fe" stroke-width="1.5"/>
    </g>

    <!-- Orbiting Floating Cyber Badges (Separated outer position and inner animation) -->
    <g transform="translate(585, 75)">
      <g class="float-item1">
        <rect width="80" height="28" rx="8" fill="#0b132b" stroke="#38bdf8" stroke-width="1" filter="url(#drop-shadow)"/>
        <text x="40" y="18" class="font-mono" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">🐍 Python</text>
      </g>
    </g>

    <g transform="translate(805, 80)">
      <g class="float-item2">
        <rect width="80" height="28" rx="8" fill="#0b132b" stroke="#ec4899" stroke-width="1" filter="url(#drop-shadow)"/>
        <text x="40" y="18" class="font-mono" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">🧠 AI / ML</text>
      </g>
    </g>

    <g transform="translate(815, 270)">
      <g class="float-item3">
        <rect width="82" height="28" rx="8" fill="#0b132b" stroke="#10b981" stroke-width="1" filter="url(#drop-shadow)"/>
        <text x="41" y="18" class="font-mono" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">👁️ OpenCV</text>
      </g>
    </g>

    <g transform="translate(600, 275)">
      <g class="float-item2">
        <rect width="70" height="28" rx="8" fill="#0b132b" stroke="#f59e0b" stroke-width="1" filter="url(#drop-shadow)"/>
        <text x="35" y="18" class="font-mono" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">🗄️ SQL</text>
      </g>
    </g>

    <!-- Live Data Pulse Bars -->
    <g transform="translate(705, 5)">
      <rect x="0" y="215" width="4" height="20" rx="2" fill="#00f2fe" class="bar-1" />
      <rect x="8" y="208" width="4" height="30" rx="2" fill="#38bdf8" class="bar-2" />
      <rect x="16" y="218" width="4" height="15" rx="2" fill="#818cf8" class="bar-3" />
      <rect x="24" y="205" width="4" height="35" rx="2" fill="#a855f7" class="bar-1" />
      <rect x="32" y="212" width="4" height="24" rx="2" fill="#c084fc" class="bar-2" />
      <rect x="40" y="220" width="4" height="12" rx="2" fill="#ec4899" class="bar-3" />
      <rect x="48" y="209" width="4" height="28" rx="2" fill="#00f2fe" class="bar-1" />
      <rect x="56" y="216" width="4" height="18" rx="2" fill="#38bdf8" class="bar-2" />
      <rect x="64" y="203" width="4" height="38" rx="2" fill="#34d399" class="bar-3" />
    </g>

    <!-- Connecting Fiber Optics Lines -->
    <path d="M 665 100 Q 700 125 715 155" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
    <path d="M 805 105 Q 775 130 765 155" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
    <path d="M 670 275 Q 700 245 715 215" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
    <path d="M 815 270 Q 780 245 765 215" stroke="#34d399" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5"/>

  </g>

</svg>
